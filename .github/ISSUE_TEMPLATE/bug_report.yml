name: Bug report
description: Something in the app doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't include your AI key, or screenshots that show personal data you'd rather keep private.
        Security problems go through the [Security tab](https://github.com/warwickbuilds/calories-and-steps/security), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Calories tab
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "0.16.0"
    validations:
      required: true
  - type: dropdown
    id: apk
    attributes:
      label: Which APK?
      options:
        - arm64
        - universal
        - Don't know
        - Development build
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 9, Android 16"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Today
        - Calories and food log
        - Barcodes and labels
        - Photo meal estimates and voice
        - Steps and Health Connect
        - Weight and weight import
        - Progress, body fat and photos
        - Backup and restore
        - Settings and onboarding
        - Updates and installing
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots, a screen recording, or anything else that helps.
